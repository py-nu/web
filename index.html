<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Labs</title>
<meta name="description" content="Open-source tools and research from Acme Labs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#14181f; --muted:#5b6575; --line:#dfe3ea;
  --pl:#3b5bdb; --pli:#ffffff; --pd:#8da2ff; --pdi:#0f1319;
  --accent:var(--pl); --accent-ink:var(--pli); --code-bg:#10151d; --code-ink:#e6ebf5;
  --radius:10px; --max:1080px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --surface:#171c24; --ink:#eef1f6; --muted:#98a2b3; --line:#2a313c;
    --accent:var(--pd); --accent-ink:var(--pdi); --code-bg:#0a0d12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --ink:#eef1f6; --muted:#98a2b3; --line:#2a313c;
  --accent:var(--pd); --accent-ink:var(--pdi); --code-bg:#0a0d12; color-scheme:dark;
}
/* Palettes: accent colors chosen from the Okabe-Ito colorblind-safe set, darkened or lightened to pass WCAG AA text contrast */
:root[data-palette="teal"]{--pl:#00735a;--pli:#ffffff;--pd:#4fd1ae;--pdi:#04140f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
.btn,.nt,.brand{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
section{padding:56px 0 72px}
section[hidden]{display:none}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;margin:0}
h2{font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:8px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 32px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;font-size:.95rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* nav */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand img{width:26px;height:26px;border-radius:6px}
.tabbar{display:flex;gap:4px;align-self:stretch}
.nt{display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:.95rem;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.nt:hover{color:var(--ink)}
.nt[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.ctl{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer;padding:0;color:#fff;font-size:.7rem;line-height:1;display:grid;place-items:center}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1rem}
@media (max-width:720px){
  nav{gap:0}
  .brand{margin-right:auto;height:52px}
  .ctl{order:2}
  .tabbar{order:3;width:100%;overflow-x:auto;height:44px;margin:0 -8px;padding:0 8px}
  .nt{white-space:nowrap;padding:0 12px}
}

/* hero */
.hero{padding:48px clamp(24px,6vw,72px) 64px}
.about-body{border-top:1px solid var(--line);padding-top:56px;padding-left:clamp(24px,6vw,72px)}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);max-width:16ch}
.hero p{font-size:1.15rem;color:var(--muted);max-width:56ch;margin:20px 0 28px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:48px;color:var(--muted);font-size:.95rem}
.stats b{display:block;color:var(--ink);font-size:1.5rem;letter-spacing:-.02em}

/* about */
.about-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}
.about-grid p{margin:0 0 16px}
.focus{display:grid;gap:12px}
.focus div{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.focus b{display:block}
.focus span{color:var(--muted);font-size:.93rem}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:28px}}

/* institution logos in footer */
.flogos{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 16px;margin-bottom:28px}
.flogo{display:flex;align-items:center;justify-content:center;height:56px;min-width:110px;padding:8px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.flogo:hover{border-color:var(--accent)}
.flogo img{display:block;max-height:36px;max-width:150px;width:auto;height:auto;object-fit:contain}
.flogo .fname{color:#14181f;font-weight:600;font-size:.9rem;text-align:center;line-height:1.2}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.person img{width:64px;height:64px;border-radius:50%;background:var(--line);display:block;margin-bottom:14px}
.person h3{font-size:1.05rem}
.person .role{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.person .links{display:flex;gap:12px;font-size:.88rem}

/* publications */
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.tools input{flex:1 1 240px;width:auto}.tools select{width:auto}
.pub{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:16px}
.pub .yr{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.pub h3{font-size:1.08rem;letter-spacing:-.01em}
.pub .meta{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.pub .links{display:flex;gap:14px;font-size:.9rem}
.empty{color:var(--muted);padding:24px 0}

/* packages */
.pk{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.pk-list{display:grid;gap:6px;position:sticky;top:120px}
.pk-item{text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.pk-item:hover{background:var(--surface)}
.pk-item[aria-selected="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.pk-item small{display:block;color:var(--muted)}
.pk-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;min-width:0}
.pk-panel h3{font-size:1.5rem;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.badge{font-size:.78rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px;letter-spacing:0}
.pk-panel>p{color:var(--muted);margin:8px 0 20px}
/* .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font:inherit;font-size:.92rem;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)} */
.code{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:8px;margin:0 0 18px}
.code pre{margin:0;padding:16px 64px 16px 18px;overflow-x:auto;font:.88rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;background:#ffffff1a;color:var(--code-ink);border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font:.8rem system-ui}
.copy:hover{background:#ffffff33}
/* .pk-panel h4{margin:22px 0 8px;font-size:1rem}
.pk-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.views{margin-bottom:22px}
.views .tab{font-weight:600;font-size:.98rem;padding:10px 16px}
.docbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.92rem}
.docbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.docbox iframe{display:block;width:100%;height:min(75vh,720px);min-height:460px;border:0;background:var(--surface)}
.docmiss{padding:36px 28px}
.docmiss h4{margin-top:0}
.docmiss p{color:var(--muted);margin:0 0 14px} */
.pk-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{margin:1.6em 0 .5em;line-height:1.25;letter-spacing:-.01em}
.md h1{font-size:1.45rem}.md h2{font-size:1.25rem;padding-bottom:.3em;border-bottom:1px solid var(--line)}.md h3{font-size:1.1rem}
.md p,.md ul,.md ol,.md table,.md blockquote{margin:0 0 1em}
.md ul,.md ol{padding-left:1.5em}
.md img{max-width:100%;height:auto}
.md code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.1em .35em}
.md .code code{background:none;border:0;padding:0;color:inherit}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 12px}
.md blockquote{border-left:3px solid var(--line);margin-left:0;padding-left:16px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line)}
.md .anchor,.md clipboard-copy{display:none}
.md-state{color:var(--muted)}
@media (max-width:820px){
  .pk{grid-template-columns:1fr}
  .pk-list{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
}

/* contact */
/* .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:48px} */
.contact{max-width:560px}
.contact ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.contact li span{display:block;color:var(--muted);font-size:.88rem}
/* form{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:.92rem;font-weight:600}
textarea{min-height:130px;resize:vertical}
@media (max-width:760px){.contact{grid-template-columns:1fr;gap:28px}} */

footer{border-top:1px solid var(--line);padding:40px 0 28px;color:var(--muted);font-size:.9rem;text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header><div class="wrap"><nav aria-label="Main">
  <a class="brand" href="#about"><img id="logo" alt="" hidden><span id="brand"></span></a>

    <a class="nt" role="tab" id="t-publications" href="#publications" aria-controls="publications">Publications</a>

    <a class="nt" role="tab" id="t-contact" href="#contact" aria-controls="contact">Contact</a>
  </div>
  <div class="ctl">
    <div class="ctl" id="swatches" role="group" aria-label="Color palette"></div>
    <button id="theme" aria-label="Toggle dark mode">◐</button>

</nav></div></header>

<main id="top">
  <section id="about" role="tabpanel" aria-labelledby="t-about" style="padding:0">
  <div class="wrap hero">

    </div>
  </div>
  </section>

  <section id="people" role="tabpanel" aria-labelledby="t-people" hidden><div class="wrap">

      <select id="yr" aria-label="Filter by year"></select>
    </div>
    <div id="pubs"></div>
  </div></section>

  <section id="packages" role="tabpanel" aria-labelledby="t-packages" hidden><div class="wrap">
    <h2>Packages</h2>
    <!-- <p class="lead">Install any package in one line, then follow its documentation.</p> -->

    <div class="pk">
      <div class="pk-list" id="pk-list" role="tablist" aria-label="Packages"></div>
      <div class="pk-panel" id="pk-panel" role="tabpanel"></div>
    </div>
  </div></section>

  <section id="contact" role="tabpanel" aria-labelledby="t-contact" hidden><div class="wrap">
    <h2>Contact</h2>
    <p class="lead" id="c-lead"></p>
    <div class="contact">

        <button class="btn primary" type="submit">Send message</button>
      </form> -->
    </div>
  </div></section>
</main>

<footer><div class="wrap"><div class="flogos" id="flogos" role="list" aria-label="Institutions"></div><div id="foot"></div></div></footer>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#h-tag").textContent = C.tagline;

/* institution logos (footer) */
$("#flogos").innerHTML = (C.institutions || []).map(i => {
  const inner = i.logo ? `<img class="lg" src="${esc(i.logo)}" alt="${esc(i.name)}" data-n="${esc(i.name)}">` : `<span class="fname">${esc(i.name)}</span>`;
  const attrs = `class="flogo" role="listitem" title="${esc(i.name)}"`;
  return i.url ? `<a ${attrs} href="${esc(i.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div ${attrs}>${inner}</div>`;
}).join("");
/* if a logo file fails to load, show the institution's name instead */
document.addEventListener("error", e => {
  const t = e.target;
  if (t.tagName === "IMG" && t.classList.contains("lg")) t.outerHTML = `<span class="fname">${t.dataset.n}</span>`;
}, true);

/* about */
$("#a-lead").textContent = C.about.lead;
$("#a-body").innerHTML = C.about.body.map(p => `<p>${esc(p)}</p>`).join("");
$("#a-focus").innerHTML = C.about.focus.map(f => `<div><b>${esc(f.title)}</b><span>${esc(f.text)}</span></div>`).join("");

/* people */
$("#people-grid").innerHTML = C.people.map(p => {
  const links = [
    p.github && `<a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`,
    p.site && `<a href="${esc(p.site)}" target="_blank" rel="noopener">Website</a>`,
    p.scholar && `<a href="${esc(p.scholar)}" target="_blank" rel="noopener">Scholar</a>`
  ].filter(Boolean).join("");
  const img = p.photo || (p.github ? `https://github.com/${p.github}.png?size=64` : "");
  return `<article class="person">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}
    <h3>${esc(p.name)}</h3><div class="role">${esc(p.role)}</div><div class="links">${links}</div></article>`;
}).join("");

/* publications */
const years = [...new Set(C.publications.map(p => p.year))].sort((a, b) => b - a);
$("#yr").innerHTML = `<option value="">All years</option>` + years.map(y => `<option>${y}</option>`).join("");
function renderPubs() {
  const q = $("#q").value.toLowerCase(), y = $("#yr").value;
  const list = C.publications.filter(p =>
    (!y || String(p.year) === y) &&
    (!q || [p.title, p.authors, p.venue].join(" ").toLowerCase().includes(q))
  ).sort((a, b) => b.year - a.year);
  $("#pubs").innerHTML = list.length ? list.map(p => {
    const links = [["Paper", p.paper], ["PDF", p.pdf], ["Code", p.code], ["Data", p.data]]
      .filter(l => l[1]).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join("");
    return `<article class="pub"><div class="yr">${esc(p.year)}</div><div>
      <h3>${esc(p.title)}</h3><div class="meta">${esc(p.authors)}. ${esc(p.venue)}.</div>
      <div class="links">${links}</div></div></article>`;
  }).join("") : `<div class="empty">No publications match your search. Clear the filters to see all of them.</div>`;
}
$("#q").addEventListener("input", renderPubs);
$("#yr").addEventListener("change", renderPubs);
renderPubs();

    <div class="pk-links">${p.repo ? `<a class="btn" href="${esc(p.repo)}" target="_blank" rel="noopener">Source on GitHub</a>` : ""}</div>`;

/* Embeds the generated docs. Only the same site can be embedded reliably; external sites may refuse framing. */
function loadReadme(p, idx) {
  const box = $("#md"), repo = repoPath(p);
  const show = html => { if (idx === curPkg && box.isConnected) { box.innerHTML = html; fixReadme(box, repo); } };
  const fail = () => { if (idx === curPkg && box.isConnected) box.innerHTML = `<p class="md-state">The README could not be loaded${p.repo ? `. <a href="${esc(p.repo)}" target="_blank" rel="noopener">Read it on GitHub</a>.` : "."}</p>`; };
  if (!repo) return fail();
  if (readmes[repo]) return show(readmes[repo]);
  fetch(`https://api.github.com/repos/${repo}/readme`, { headers: { Accept: "application/vnd.github.html+json" } })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(h => { readmes[repo] = h; show(h); })
    .catch(fail);
}
/* makes relative links and images work, and adds Copy buttons to code blocks */
function fixReadme(box, repo) {
  const abs = /^([a-z][a-z0-9+.-]*:|\/\/|#)/i, clean = u => u.replace(/^\.?\//, "");
  box.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (!abs.test(h)) a.setAttribute("href", `https://github.com/${repo}/blob/HEAD/${clean(h)}`);
    if (!h.startsWith("#")) { a.target = "_blank"; a.rel = "noopener"; }
  });
  box.querySelectorAll("img[src]").forEach(i => {
    const u = i.getAttribute("src");
    if (!abs.test(u)) i.src = `https://raw.githubusercontent.com/${repo}/HEAD/${clean(u)}`;
    i.loading = "lazy";
  });
  box.querySelectorAll("pre").forEach(pre => {
    const w = document.createElement("div"), b = document.createElement("button");
    w.className = "code"; b.className = "copy"; b.textContent = "Copy";
    pre.replaceWith(w); w.append(pre, b);
  });
}
$("#pk-list").addEventListener("click", e => {
  const b = e.target.closest(".pk-item"); if (!b) return;
  curPkg = +b.dataset.i; renderPkgList(); renderPkg();
});
$("#pk-panel").addEventListener("click", e => {
  const a = e.target.closest('.md a[href^="#"]');
  if (a) {   /* in-README links scroll inside the README instead of changing the tab */
    e.preventDefault();
    const id = decodeURIComponent(a.getAttribute("href").slice(1));
    const el = document.getElementById(id) || document.getElementById("user-content-" + id);
    if (el) (el.closest("h1,h2,h3,h4,h5,h6") || el).scrollIntoView();
    return;
  }
  const c = e.target.closest(".copy");
  if (c) {
    const text = c.previousElementSibling.textContent;
    const done = () => { c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => {
      const r = document.createRange(); r.selectNodeContents(c.previousElementSibling);
      getSelection().removeAllRanges(); getSelection().addRange(r); c.textContent = "Press Ctrl+C";
    });
  }
});
renderPkgList(); renderPkg();

/* theme toggle */
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
$("#theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});

/* tabs: one section visible at a time, driven by the URL hash (#people etc.) */
const tabs = [...document.querySelectorAll(".nt")];
const ids = tabs.map(t => t.hash.slice(1));
function showTab(id, moveScroll) {
  if (!ids.includes(id)) id = ids[0];
  ids.forEach((x, i) => {
    document.getElementById(x).hidden = x !== id;
    tabs[i].setAttribute("aria-selected", x === id);
    tabs[i].tabIndex = x === id ? 0 : -1;
  });
  document.title = (id === ids[0] ? "" : tabs[ids.indexOf(id)].textContent + " | ") + C.name;
  if (moveScroll) scrollTo(0, 0);
  tabs[ids.indexOf(id)].scrollIntoView({ block: "nearest", inline: "nearest" });
}
addEventListener("hashchange", () => showTab(location.hash.slice(1), true));
/* click handling works even where the hash cannot change (e.g. embedded previews) */
function go(id) {
  showTab(id, true);
  try { if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id); } catch (e) {}
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || !ids.includes(a.hash.slice(1))) return;
  e.preventDefault(); go(a.hash.slice(1));
});
tabs.forEach((t, i) => t.addEventListener("keydown", e => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (e.key === "Home") var n = 0; else if (e.key === "End") n = tabs.length - 1; else if (d) n = (i + d + tabs.length) % tabs.length; else return;
  e.preventDefault(); tabs[n].focus(); go(ids[n]);
}));
showTab(location.hash.slice(1), false);

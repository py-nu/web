<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyNu</title>
<meta name="description" content="Advancing software tools for neutrino physics analyses.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#14181f; --muted:#5b6575; --line:#dfe3ea;
  --pl:#00735a; --pli:#ffffff; --pd:#4fd1ae; --pdi:#04140f;
  --accent:var(--pl); --accent-ink:var(--pli); --code-bg:#10151d; --code-ink:#e6ebf5;
  --radius:10px; --max:1080px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --surface:#171c24; --ink:#eef1f6; --muted:#98a2b3; --line:#2a313c;
    --accent:var(--pd); --accent-ink:var(--pdi); --code-bg:#0a0d12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --ink:#eef1f6; --muted:#98a2b3; --line:#2a313c;
  --accent:var(--pd); --accent-ink:var(--pdi); --code-bg:#0a0d12; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
.btn,.nt,.brand{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
section{padding:56px 0 72px}
section[hidden]{display:none}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;margin:0}
h2{font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:8px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 32px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;font-size:.95rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* nav */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand img{width:26px;height:26px;border-radius:6px}
.tabbar{display:flex;gap:4px;align-self:stretch}
.nt{display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:.95rem;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.nt:hover{color:var(--ink)}
.nt[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.ctl{display:flex;align-items:center;gap:8px}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1rem}
@media (max-width:720px){
  nav{gap:0}
  .brand{margin-right:auto;height:52px}
  .ctl{order:2}
  .tabbar{order:3;width:100%;overflow-x:auto;height:44px;margin:0 -8px;padding:0 8px}
  .nt{white-space:nowrap;padding:0 12px}
}

/* hero */
.hero{padding:48px clamp(24px,6vw,72px) 64px}
.about-body{border-top:1px solid var(--line);padding-top:56px;padding-left:clamp(24px,6vw,72px)}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);max-width:16ch}
.hero p{font-size:1.15rem;color:var(--muted);max-width:56ch;margin:20px 0 28px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:48px;color:var(--muted);font-size:.95rem}
.stats b{display:block;color:var(--ink);font-size:1.5rem;letter-spacing:-.02em}

/* about */
.about-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}
.about-grid p{margin:0 0 16px}
.focus{display:grid;gap:12px}
.focus div{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.focus b{display:block}
.focus span{color:var(--muted);font-size:.93rem}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:28px}}

/* institution logos in footer */
.flogos{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 16px;margin-bottom:28px}
.flogo{display:flex;align-items:center;justify-content:center;height:56px;min-width:110px;padding:8px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.flogo:hover{border-color:var(--accent)}
.flogo img{display:block;max-height:36px;max-width:190px;width:auto;height:auto;object-fit:contain}
.flogo .fname{color:#14181f;font-weight:600;font-size:.9rem;text-align:center;line-height:1.2}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.person img{width:64px;height:64px;border-radius:50%;background:var(--line);display:block;margin-bottom:14px}
.person h3{font-size:1.05rem}
.person .role{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.person .links{display:flex;gap:12px;font-size:.88rem}

/* publications */
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.tools input{flex:1 1 240px;width:auto}.tools select{width:auto}
.pub{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:16px}
.pub .yr{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.pub h3{font-size:1.08rem;letter-spacing:-.01em}
.pub .meta{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.pub .links{display:flex;gap:14px;font-size:.9rem}
.empty{color:var(--muted);padding:24px 0}

/* packages */
.pk{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.pk-list{display:grid;gap:6px;position:sticky;top:120px}
.pk-item{text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.pk-item:hover{background:var(--surface)}
.pk-item[aria-selected="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.pk-item small{display:block;color:var(--muted)}
.pk-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;min-width:0}
.pk-panel h3{font-size:1.5rem;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.badge{font-size:.78rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px;letter-spacing:0}
.pk-panel>p{color:var(--muted);margin:8px 0 20px}
.code{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:8px;margin:0 0 18px}
.code pre{margin:0;padding:16px 64px 16px 18px;overflow-x:auto;font:.88rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;background:#ffffff1a;color:var(--code-ink);border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font:.8rem system-ui}
.copy:hover{background:#ffffff33}
.pk-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{margin:1.6em 0 .5em;line-height:1.25;letter-spacing:-.01em}
.md h1{font-size:1.45rem}.md h2{font-size:1.25rem;padding-bottom:.3em;border-bottom:1px solid var(--line)}.md h3{font-size:1.1rem}
.md p,.md ul,.md ol,.md table,.md blockquote{margin:0 0 1em}
.md ul,.md ol{padding-left:1.5em}
.md img{max-width:100%;height:auto}
.md code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.1em .35em}
.md .code code{background:none;border:0;padding:0;color:inherit}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 12px}
.md blockquote{border-left:3px solid var(--line);margin-left:0;padding-left:16px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line)}
.md .anchor,.md clipboard-copy{display:none}
.md-state{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font:inherit;font-size:.98rem;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.docbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.92rem}
.docbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.docbox iframe{display:block;width:100%;height:min(78vh,760px);min-height:480px;border:0;background:#fff}
.docmiss{padding:36px 28px}
.docmiss p{color:var(--muted);margin:0 0 12px}
.nb-cell{margin:0 0 20px}
.nb-cell .code{margin-bottom:6px}
.nb-out{margin:0 0 8px;padding:8px 14px;border-left:3px solid var(--line);overflow-x:auto}
pre.nb-out{font:.86rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
.nb-out.err{border-left-color:var(--ink)}
.nb-out img{display:block;max-width:100%;height:auto;background:#fff}
.nb-html table{border-collapse:collapse;font-size:.9rem}
.nb-html th,.nb-html td{border:1px solid var(--line);padding:4px 10px;text-align:right}
@media (max-width:820px){
  .pk{grid-template-columns:1fr}
  .pk-list{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
}

/* contact */
.contact{max-width:560px}
.contact ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.contact li span{display:block;color:var(--muted);font-size:.88rem}

footer{border-top:1px solid var(--line);padding:40px 0 28px;color:var(--muted);font-size:.9rem;text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header><div class="wrap"><nav aria-label="Main">
  <a class="brand" href="#about"><img id="logo" alt="" hidden><span id="brand"></span></a>
  <div class="tabbar" role="tablist" aria-label="Sections">
    <a class="nt" role="tab" id="t-about" href="#about" aria-controls="about">About</a>
    <a class="nt" role="tab" id="t-people" href="#people" aria-controls="people">People</a>
    <a class="nt" role="tab" id="t-publications" href="#publications" aria-controls="publications">Publications</a>
    <a class="nt" role="tab" id="t-packages" href="#packages" aria-controls="packages">Packages</a>
    <a class="nt" role="tab" id="t-contact" href="#contact" aria-controls="contact">Contact</a>
  </div>
  <div class="ctl"><button id="theme" aria-label="Toggle dark mode">◐</button></div>
</nav></div></header>

<main id="top">
  <section id="about" role="tabpanel" aria-labelledby="t-about" style="padding:0">
  <div class="wrap hero">
    <h1 id="h-name"></h1>
    <p id="h-tag"></p>
    <div class="row">
      <a class="btn primary" href="#packages">Browse packages</a>
      <a class="btn" id="h-gh" target="_blank" rel="noopener">View on GitHub</a>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="wrap about-body">
    <h2>About</h2>
    <p class="lead" id="a-lead"></p>
    <div class="about-grid">
      <div id="a-body"></div>
      <div class="focus" id="a-focus"></div>
    </div>
  </div>
  </section>

  <section id="people" role="tabpanel" aria-labelledby="t-people" hidden><div class="wrap">
    <h2>People</h2>
    <p class="lead">The researchers and engineers behind our work.</p>
    <div class="people" id="people-grid"></div>
  </div></section>

  <section id="publications" role="tabpanel" aria-labelledby="t-publications" hidden><div class="wrap">
    <h2>Publications</h2>
    <p class="lead">Papers, preprints and reports from our members.</p>
    <div class="tools">
      <input id="q" type="search" placeholder="Search by title, author or venue" aria-label="Search publications">
      <select id="yr" aria-label="Filter by year"></select>
    </div>
    <div id="pubs"></div>
  </div></section>

  <section id="packages" role="tabpanel" aria-labelledby="t-packages" hidden><div class="wrap">
    <h2>Packages</h2>
    <p class="lead">Installation, usage and API documentation for each package.</p>
    <div class="pk">
      <div class="pk-list" id="pk-list" role="tablist" aria-label="Packages"></div>
      <div class="pk-panel" id="pk-panel" role="tabpanel"></div>
    </div>
  </div></section>

  <section id="contact" role="tabpanel" aria-labelledby="t-contact" hidden><div class="wrap">
    <h2>Contact</h2>
    <p class="lead" id="c-lead"></p>
    <div class="contact">
      <ul id="c-list"></ul>
    </div>
  </div></section>
</main>

<footer><div class="wrap"><div class="flogos" id="flogos" role="list" aria-label="Institutions"></div><div id="foot"></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
/* ============================================================
   EDIT THIS BLOCK ONLY. Everything on the page is generated
   from CONFIG. Replace the sample content with your own.
   ============================================================ */
const CONFIG = {
  name: "PyNu",
  github: "py-nu",                           // your GitHub organization name
  logo: "pynu_logo.png",                     // optional: path or URL to a logo image
  tagline: "Advancing software tools for neutrino physics analyses.",

  about: {
    lead: "We are a group of researchers bringing expertise from different fields to develop a comprehensive, flexible and performant analysis software for the neutrino physics community.",
    body: [
      "This project was born in 2022 with the need to develop flexible and performant physics analyses in the context of combined atmospheric neutrino oscillations. From there, we found a way to improve existing fitting software.",
      "The goal is to develop a software that bridges between theory, phenomenology and experiment of fluxes, oscillations, cross sections and detectors, combined with the development of statistical tools."
    ],
    focus: [
      { title: "Flexible", text: "Easy to deploy any physics analysis." },
      { title: "Any neutrino physics", text: "From experiments to phenomenology." },
      { title: "Open community", text: "Public and open to everyone." }
    ],
    stats: [ ["2", "packages"], ["8", "members"], ["5", "publications"] ]
  },

  // Institution logos, shown at the bottom of every page. Put each logo file (SVG or PNG) next to this page
  // and set "logo" to its path. "url" is the institution's website; the logo links to it (leave "" for no link).
  institutions: [
    { name: "IGFAE/USC",    logo: "igfae-logo.svg",   url: "" },
    { name: "Harvard U.",   logo: "harvard-logo.jpg", url: "" },
    { name: "UAM",          logo: "uam-logo.jpg",     url: "" },
    { name: "DIPC",         logo: "dipc-logo.png",    url: "" },
    { name: "U. Liverpool", logo: "liv-logo.jpg",     url: "" },
    { name: "U. Oviedo",    logo: "uo-logo.png",      url: "" },
    { name: "IFAE",         logo: "ifae_logo.png",    url: "" },
    { name: "U. Utah",      logo: "utah-logo.jpg",    url: "" },
    { name: "AEI",          logo: "aei-logo.jpg",     url: "" }
  ],

  people: [
    { name: "Alba Burgos",            role: "Harvard U.",   github: "albaburgos" },
    { name: "Helena Almazán Molina",  role: "DIPC",         github: "halmamol" },
    { name: "Pilar Casado Lechuga",   role: "IFAE",         github: "mpcasado" },
    { name: "Pablo FM",               role: "IGFAE/USC",    github: "pabloferm" },
    { name: "Miaochen Jin",           role: "Harvard U.",   github: "MiaochenJin" },
    { name: "Unik Limbu",             role: "U. Liverpool", github: "uniklimbu10" },
    { name: "Iván Martínez-Soler",    role: "UAM",          github: "imartinezsoler" },
    { name: "Sergio Suárez Gómez",    role: "UniOvi",       github: "Sergio-Suarez" },
    { name: "Shouvik Mondal",         role: "U. Utah",      github: "SMutah" }
  ],

  publications: [
    { title: "Measuring Oscillations with a Million atmospheric Neutrinos", authors: "C. A. Argüelles, P. Fernández-Menéndez, I. Martínez-Soler, M. Jin (靳淼辰)", venue: "Phys. Rev. X 13, 041055", year: 2023, paper: "https://journals.aps.org/prx/pdf/10.1103/PhysRevX.13.041055" },
    { title: "CHIC: Cayley Hamilton, invariants and constants for neutrino oscillation probabilities and gradients", authors: "P. Fernández-Menéndez", venue: "J. Phys. G: Nucl. Part. Phys. 53 075002", year: 2026, paper: "https://iopscience.iop.org/article/10.1088/1361-6471/ae7818/pdf" },
    { title: "When CPT Violation Hides in Plain Sight: How CP Measurements Are Compromised and How to Fix Them", authors: "M. Jin (靳淼辰), G. Barenboim (加布里埃拉·巴伦博伊姆), C. A. Argüelles, P. Fernández-Menéndez (帕布洛·费尔南德斯), I. Martinez-Soler", venue: "arXiv:2606.20830 [hep-ph]", year: 2026, paper: "https://arxiv.org/pdf/2606.20830" },
    { title: "Boosting neutrino mass ordering sensitivity with inelasticity for atmospheric neutrino oscillation measurement", authors: "S. Giner Olavarrieta, C. A. Argüelles, P. Fernández-Menéndez, I. Martínez-Soler, M. Jin (靳淼辰)", venue: "Phys. Rev. D 110, L051101", year: 2024, paper: "https://journals.aps.org/prd/pdf/10.1103/PhysRevD.110.L051101" },
    { title: "Evidence for Normal Neutrino Ordering with Combined Atmospheric Neutrino Experiments", authors: "C. A. Argüelles, P. Fernández-Menéndez, I. Martínez-Soler, M. Jin (靳淼辰)", venue: "arXiv:2610.12208v2 [hep-ex]", year: 2026, paper: "https://arxiv.org/pdf/2610.12208" }
  ],

  // Packages. Each package gets a README tab, plus optional tabs:
  //   readme:   a GitHub link to README.md (public repos only) or a Markdown file stored next to this page
  //             (for example "pynu_README.md"; use this for private repos)
  //   docs:     path to the built HTML documentation stored in this site (adds a Documentation tab)
  //   notebook: path to a Jupyter notebook stored in this site (adds an Example tab)
  packages: [
    {
      name: "pynu", language: "Python", version: "1.4.0",
      docs: "pynu_doc/index.html",
      readme: "pynu_README.md",
      repo: "https://github.com/py-nu/pynu"
    },
    {
      name: "chic", language: "C++", version: "0.9.2",
      description: "",
      docs: "chic_doc/index.html",
      notebook: "example.ipynb",
      readme: "chic_README.md",
      repo: "https://github.com/py-nu/chic"
    }
  ],

  contact: {
    lead: "Questions, collaboration ideas?",
    email: "pablo.fer@cern.ch",
    // address: "Department of Computer Science, Example University",
    links: [ ["Discussions", "https://github.com/orgs/py-nu/discussions"], ["Report an issue", "https://github.com/py-nu/.github/issues"] ]
  }
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const C = CONFIG, ghUrl = "https://github.com/" + C.github;

/* header + hero */
document.title = C.name;
$("#brand").textContent = C.name;
$("#h-name").textContent = C.name;
$("#h-tag").textContent = C.tagline;
$("#h-gh").href = ghUrl;
if (C.logo) { const l = $("#logo"); l.onerror = () => { l.hidden = true; }; l.src = C.logo; l.hidden = false; }
$("#stats").innerHTML = (C.about.stats || []).map(([n, l]) => `<div><b>${esc(n)}</b>${esc(l)}</div>`).join("");

/* institution logos (footer) */
$("#flogos").innerHTML = (C.institutions || []).map(i => {
  const inner = i.logo ? `<img class="lg" src="${esc(i.logo)}" alt="${esc(i.name)}" data-n="${esc(i.name)}">` : `<span class="fname">${esc(i.name)}</span>`;
  const attrs = `class="flogo" role="listitem" title="${esc(i.name)}"`;
  return i.url ? `<a ${attrs} href="${esc(i.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div ${attrs}>${inner}</div>`;
}).join("");
/* if a logo file fails to load, show the institution's name instead */
document.addEventListener("error", e => {
  const t = e.target;
  if (t.tagName === "IMG" && t.classList.contains("lg")) t.outerHTML = `<span class="fname">${t.dataset.n}</span>`;
}, true);

/* about */
$("#a-lead").textContent = C.about.lead;
$("#a-body").innerHTML = C.about.body.map(p => `<p>${esc(p)}</p>`).join("");
$("#a-focus").innerHTML = C.about.focus.map(f => `<div><b>${esc(f.title)}</b><span>${esc(f.text)}</span></div>`).join("");

/* people */
$("#people-grid").innerHTML = C.people.map(p => {
  const links = [
    p.github && `<a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`,
    p.site && `<a href="${esc(p.site)}" target="_blank" rel="noopener">Website</a>`,
    p.scholar && `<a href="${esc(p.scholar)}" target="_blank" rel="noopener">Scholar</a>`
  ].filter(Boolean).join("");
  const img = p.photo || (p.github ? `https://github.com/${p.github}.png?size=64` : "");
  return `<article class="person">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}
    <h3>${esc(p.name)}</h3><div class="role">${esc(p.role)}</div><div class="links">${links}</div></article>`;
}).join("");

/* publications */
const years = [...new Set(C.publications.map(p => p.year))].sort((a, b) => b - a);
$("#yr").innerHTML = `<option value="">All years</option>` + years.map(y => `<option>${y}</option>`).join("");
function renderPubs() {
  const q = $("#q").value.toLowerCase(), y = $("#yr").value;
  const list = C.publications.filter(p =>
    (!y || String(p.year) === y) &&
    (!q || [p.title, p.authors, p.venue].join(" ").toLowerCase().includes(q))
  ).sort((a, b) => b.year - a.year);
  $("#pubs").innerHTML = list.length ? list.map(p => {
    const links = [["Paper", p.paper], ["PDF", p.pdf], ["Code", p.code], ["Data", p.data]]
      .filter(l => l[1]).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join("");
    return `<article class="pub"><div class="yr">${esc(p.year)}</div><div>
      <h3>${esc(p.title)}</h3><div class="meta">${esc(p.authors)}. ${esc(p.venue)}.</div>
      <div class="links">${links}</div></div></article>`;
  }).join("") : `<div class="empty">No publications match your search. Clear the filters to see all of them.</div>`;
}
$("#q").addEventListener("input", renderPubs);
$("#yr").addEventListener("change", renderPubs);
renderPubs();

/* packages: the README of each repository is fetched from GitHub (already rendered to safe HTML) */
let curPkg = 0, curView = "readme";
const readmes = {};
const repoPath = p => { const m = /github\.com\/([^/]+\/[^/#?]+)/.exec(p.repo || ""); return m && m[1].replace(/\.git$/, ""); };
/* accepts a normal GitHub page link (.../blob/main/README.md) and turns it into the raw file link */
const rawUrl = u => u.replace(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/blob\//, "https://raw.githubusercontent.com/$1/");
function renderPkgList() {
  $("#pk-list").innerHTML = C.packages.map((p, i) =>
    `<button class="pk-item" role="tab" aria-selected="${i === curPkg}" data-i="${i}">${esc(p.name)}<small>${esc(p.language)}</small></button>`
  ).join("");
}
function renderPkg() {
  const p = C.packages[curPkg];
  const views = [["readme", "README"], ...(p.docs ? [["docs", "Documentation"]] : []), ...(p.notebook ? [["notebook", "Example"]] : [])];
  if (!views.some(v => v[0] === curView)) curView = "readme";
  const body = curView === "notebook"
    ? `<div class="docbar"><span>Example notebook: ${esc(p.notebook.split("/").pop())}</span><a href="${esc(p.notebook)}" download>Download notebook</a></div>
       <div class="nb" id="nb"><p class="md-state">Loading notebook…</p></div>`
    : curView === "docs"
    ? `<div class="docbar"><span>Built from the docstrings of ${esc(p.name)}</span><a href="${esc(p.docs)}" target="_blank" rel="noopener">Open in a new tab</a></div>
       <div class="docbox" id="docbox"></div>`
    : `<div class="md" id="md"><p class="md-state">Loading README…</p></div>`;
  $("#pk-panel").innerHTML = `
    <h3>${esc(p.name)} <span class="badge">${esc(p.language)}</span> ${p.version ? `<span class="badge">v${esc(p.version)}</span>` : ""}</h3>
    ${p.description ? `<p>${esc(p.description)}</p>` : ""}
    ${views.length > 1 ? `<div class="tabs" role="tablist" aria-label="${esc(p.name)} sections">${views.map(([v, l]) => `<button class="tab" role="tab" aria-selected="${v === curView}" data-v="${v}">${l}</button>`).join("")}</div>` : ""}
    ${body}
    <div class="pk-links">${p.repo ? `<a class="btn" href="${esc(p.repo)}" target="_blank" rel="noopener">Source on GitHub</a>` : ""}</div>`;
  curView === "notebook" ? loadNotebook(p, curPkg) : curView === "docs" ? loadDocs(p, curPkg) : loadReadme(p, curPkg);
}
function loadReadme(p, idx) {
  const box = $("#md"), repo = repoPath(p), local = p.readme && !/^https?:/i.test(p.readme);
  const tried = [];   /* what was attempted, shown if the README cannot be loaded */
  const show = html => { if (idx === curPkg && box.isConnected) { box.innerHTML = html; fixReadme(box, local ? null : repo); } };
  const fail = () => { if (idx === curPkg && box.isConnected) box.innerHTML = `<p class="md-state"><b>The README could not be loaded.</b></p>
    ${tried.length ? `<ul class="md-state">${tried.map(t => `<li><code>${esc(t)}</code></li>`).join("")}</ul>` : ""}
    <p class="md-state">A web page cannot read private repositories. Save the README next to this page (for example <code>pynu_README.md</code>) and set <code>readme: "pynu_README.md"</code> in CONFIG.${p.repo ? ` Or <a href="${esc(p.repo)}" target="_blank" rel="noopener">read it on GitHub</a>.` : ""}</p>`; };
  /* where to get the Markdown: the "readme" in CONFIG (a GitHub link or a file in this site), else the repository */
  const sources = p.readme ? [[rawUrl(p.readme)]] : repo ? [
    [`https://raw.githubusercontent.com/${repo}/HEAD/README.md`],
    [`https://api.github.com/repos/${repo}/readme`, { headers: { Accept: "application/vnd.github.raw+json" } }]
  ] : [];
  const key = sources.length ? sources[0][0] : "";
  if (readmes[key]) return show(readmes[key]);
  const get = i => i >= sources.length ? Promise.reject() : fetch(...sources[i]).then(
    r => r.ok ? r.text() : (tried.push(`${sources[i][0]}  →  error ${r.status}`), get(i + 1)),
    () => (tried.push(`${sources[i][0]}  →  blocked or offline (if you opened the file directly, use Live Server)`), get(i + 1)));
  get(0)
    .then(md => {
      if (typeof marked === "undefined" || typeof DOMPurify === "undefined") { tried.push("the Markdown library did not load (network blocked?)"); throw 0; }
      const html = DOMPurify.sanitize(marked.parse(md)); readmes[key] = html; show(html);
    })
    .catch(fail);
}
/* makes relative links and images work, and adds Copy buttons to code blocks */
function fixReadme(box, repo) {
  const abs = /^([a-z][a-z0-9+.-]*:|\/\/|#)/i, clean = u => u.replace(/^\.?\//, "");
  box.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (repo && !abs.test(h)) a.setAttribute("href", `https://github.com/${repo}/blob/HEAD/${clean(h)}`);
    if (!h.startsWith("#")) { a.target = "_blank"; a.rel = "noopener"; }
  });
  box.querySelectorAll("img[src]").forEach(i => {
    const u = i.getAttribute("src");
    if (repo && !abs.test(u)) i.src = `https://raw.githubusercontent.com/${repo}/HEAD/${clean(u)}`;
    i.loading = "lazy";
  });
  box.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h =>   /* anchors for in-README links, like GitHub */
    h.id = "user-content-" + h.textContent.toLowerCase().trim().replace(/[^\w\- ]+/g, "").replace(/\s/g, "-"));
  box.querySelectorAll("pre").forEach(pre => {
    const w = document.createElement("div"), b = document.createElement("button");
    w.className = "code"; b.className = "copy"; b.textContent = "Copy";
    pre.replaceWith(w); w.append(pre, b);
  });
}
/* Embeds the HTML documentation stored in this site (e.g. pynu_doc/index.html). */
function loadDocs(p, idx) {
  const box = $("#docbox");
  const missing = () => { if (idx === curPkg && box.isConnected) box.innerHTML = `<div class="docmiss"><p><b>Documentation not found.</b></p>
    <p>Nothing was found at <code>${esc(p.docs)}</code>. Copy the built HTML documentation into that folder, or fix the <code>docs</code> path in CONFIG.</p></div>`; };
  const attach = () => { if (idx === curPkg && box.isConnected) box.innerHTML = `<iframe title="${esc(p.name)} documentation" src="${esc(p.docs)}"></iframe>`; };
  fetch(p.docs, { method: "HEAD" }).then(r => r.status === 404 ? missing() : attach(), attach);
}
/* Shows a Jupyter notebook (.ipynb) stored in this site: its Markdown cells, code cells and saved outputs (figures included). */
function loadNotebook(p, idx) {
  const box = $("#nb");
  const fail = msg => { if (idx === curPkg && box.isConnected) box.innerHTML = `<div class="docmiss"><p><b>The notebook could not be shown.</b></p>
    <p>${esc(msg)} Path: <code>${esc(p.notebook)}</code>. Keep the .ipynb next to this page, and view the site through Live Server or GitHub Pages.</p></div>`; };
  fetch(p.notebook)
    .then(r => r.ok ? r.json() : Promise.reject(`File not found (error ${r.status}).`))
    .then(nb => {
      if (typeof marked === "undefined" || typeof DOMPurify === "undefined") throw "The Markdown library did not load.";
      if (!(idx === curPkg && box.isConnected)) return;
      box.innerHTML = renderNotebook(nb);
      /* figures stored as separate image files: paths are relative to the notebook's folder */
      const base = p.notebook.includes("/") ? p.notebook.slice(0, p.notebook.lastIndexOf("/") + 1) : "";
      box.querySelectorAll("img").forEach(i => {
        const u = i.getAttribute("src") || "";
        if (u && !/^([a-z][a-z0-9+.-]*:|\/)/i.test(u)) i.setAttribute("src", base + u);
      });
      box.addEventListener("error", e => {
        if (e.target.tagName !== "IMG") return;
        const n = document.createElement("span");
        n.className = "md-state"; n.textContent = `[figure not found: ${e.target.getAttribute("src")}. Copy the image file next to the notebook.]`;
        e.target.replaceWith(n);
      }, true);
    })
    .catch(e => fail(typeof e === "string" ? e : "The file is not a valid notebook, or could not be read."));
}
function renderNotebook(nb) {
  const txt = v => Array.isArray(v) ? v.join("") : String(v ?? "");
  const ansi = s => s.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
  /* images pasted into Markdown cells are stored inside the notebook as "attachment:name": turn them into real images */
  const md = (s, att) => `<div class="md">${DOMPurify.sanitize(marked.parse(txt(s).replace(/attachment:([^\s)"']+)/g, (m, n) => {
    const a = att && att[decodeURIComponent(n)], t = a && Object.keys(a)[0];
    return t ? `data:${t};base64,${txt(a[t]).replace(/\s/g, "")}` : m;
  })))}</div>`;
  const out = o => {
    if (o.output_type === "stream") return `<pre class="nb-out${o.name === "stderr" ? " err" : ""}">${esc(ansi(txt(o.text)))}</pre>`;
    if (o.output_type === "error") return `<pre class="nb-out err">${esc(ansi((o.traceback || [o.ename + ": " + o.evalue]).join("\n")))}</pre>`;
    const d = o.data || {};
    if (d["image/svg+xml"]) return `<div class="nb-out">${DOMPurify.sanitize(txt(d["image/svg+xml"]), { USE_PROFILES: { svg: true, svgFilters: true } })}</div>`;
    const img = Object.keys(d).find(k => /^image\/(png|jpe?g|gif|webp|bmp)$/.test(k));
    if (img) return `<div class="nb-out"><img alt="Notebook figure" src="data:${img};base64,${txt(d[img]).replace(/\s/g, "")}"></div>`;
    if (d["text/html"]) {
      const h = DOMPurify.sanitize(txt(d["text/html"]), { FORBID_TAGS: ["style"] });
      if (/<(img|svg|table|canvas)\b/i.test(h) || h.replace(/<[^>]*>/g, "").trim()) return `<div class="nb-out nb-html">${h}</div>`;
    }
    if (d["text/markdown"]) return `<div class="nb-out">${md(d["text/markdown"])}</div>`;
    if (d["text/plain"]) return `<pre class="nb-out">${esc(txt(d["text/plain"]))}</pre>`;
    const kinds = Object.keys(d).join(", ");
    return kinds ? `<div class="nb-out md-state">[This output (${esc(kinds)}) is interactive, so it cannot be shown here. Save the figure as an image in the notebook instead.]</div>` : "";
  };
  return (nb.cells || []).map(c => {
    const src = txt(c.source);
    if (c.cell_type === "markdown") return md(src, c.attachments);
    if (c.cell_type === "code") return `<div class="nb-cell">${src.trim() ? `<div class="code"><pre><code>${esc(src)}</code></pre><button class="copy">Copy</button></div>` : ""}${(c.outputs || []).map(out).join("")}</div>`;
    return "";
  }).join("");
}
$("#pk-list").addEventListener("click", e => {
  const b = e.target.closest(".pk-item"); if (!b) return;
  curPkg = +b.dataset.i; renderPkgList(); renderPkg();
});
$("#pk-panel").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) { curView = t.dataset.v; return renderPkg(); }
  const a = e.target.closest('.md a[href^="#"]');
  if (a) {   /* in-README links scroll inside the README instead of changing the tab */
    e.preventDefault();
    const id = decodeURIComponent(a.getAttribute("href").slice(1));
    const el = document.getElementById("user-content-" + id) || document.getElementById(id);
    if (el) (el.closest("h1,h2,h3,h4,h5,h6") || el).scrollIntoView();
    return;
  }
  const c = e.target.closest(".copy");
  if (c) {
    const text = c.previousElementSibling.textContent;
    const done = () => { c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => {
      const r = document.createRange(); r.selectNodeContents(c.previousElementSibling);
      getSelection().removeAllRanges(); getSelection().addRange(r); c.textContent = "Press Ctrl+C";
    });
  }
});
renderPkgList(); renderPkg();

/* contact */
$("#c-lead").textContent = C.contact.lead;
$("#c-list").innerHTML =
  `<li><span>Email</span><a href="mailto:${esc(C.contact.email)}">${esc(C.contact.email)}</a></li>` +
  (C.contact.address ? `<li><span>Address</span>${esc(C.contact.address)}</li>` : "") +
  `<li><span>GitHub</span><a href="${ghUrl}" target="_blank" rel="noopener">github.com/${esc(C.github)}</a></li>` +
  C.contact.links.map(([t, u]) => `<li><span>${esc(t)}</span><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, ""))}</a></li>`).join("");

/* footer */
$("#foot").textContent = `© ${new Date().getFullYear()} ${C.name}. Built with GitHub Pages.`;

/* theme toggle */
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
$("#theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});

/* tabs: one section visible at a time, driven by the URL hash (#people etc.) */
const tabs = [...document.querySelectorAll(".nt")];
const ids = tabs.map(t => t.hash.slice(1));
function showTab(id, moveScroll) {
  if (!ids.includes(id)) id = ids[0];
  ids.forEach((x, i) => {
    document.getElementById(x).hidden = x !== id;
    tabs[i].setAttribute("aria-selected", x === id);
    tabs[i].tabIndex = x === id ? 0 : -1;
  });
  document.title = (id === ids[0] ? "" : tabs[ids.indexOf(id)].textContent + " | ") + C.name;
  if (moveScroll) scrollTo(0, 0);
  tabs[ids.indexOf(id)].scrollIntoView({ block: "nearest", inline: "nearest" });
}
addEventListener("hashchange", () => showTab(location.hash.slice(1), true));
/* click handling works even where the hash cannot change (e.g. embedded previews) */
function go(id) {
  showTab(id, true);
  try { if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id); } catch (e) {}
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || !ids.includes(a.hash.slice(1))) return;
  e.preventDefault(); go(a.hash.slice(1));
});
tabs.forEach((t, i) => t.addEventListener("keydown", e => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (e.key === "Home") var n = 0; else if (e.key === "End") n = tabs.length - 1; else if (d) n = (i + d + tabs.length) % tabs.length; else return;
  e.preventDefault(); tabs[n].focus(); go(ids[n]);
}));
showTab(location.hash.slice(1), false);
</script>
